# Mosquitto MQTT Broker Configuration

# Listener on default MQTT port
listener 1883
protocol mqtt

# WebSocket listener (for Postman / browser clients)
listener 9001
protocol websockets

# Allow anonymous connections (no authentication required)
allow_anonymous true

# Logging
log_type all
log_dest stdout

# Persistence
persistence true
persistence_location /mosquitto/data/

# Max QoS level supported
# QoS 0 - at most once
# QoS 1 - at least once
# QoS 2 - exactly once
